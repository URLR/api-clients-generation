  /qrcodes:
    post:
      tags:
        - 'QR Codes'
      summary: 'Create a QR Code'
      operationId: qrcodeCreate
      requestBody:
        description: 'Info of the QR Code to create'
        content:
          application/json:
            schema:
              properties:
                size:
                  description: 'The size of the QR code (px)'
                  type: integer
                  default: 600
                  maximum: 1000
                  minimum: 100
                format:
                  description: 'The format of the QR code'
                  type: string
                  default: png
                  enum: [png, webp, svg]
                margin:
                  description: 'The margin around the QR code (px)'
                  type: integer
                  default: 0
                background_color:
                  description: 'The background color of the QR code (hexadecimal)'
                  type: string
                  default: '#ffffff'
                foreground_color:
                  description: 'The foreground color of the QR code (hexadecimal)'
                  type: string
                  default: '#000000'
              type: object
              oneOf:
                -
                  required: [url, workspace_id]
                  properties: { url: { description: 'URL of the QR Code', type: string, format: url }, workspace_id: { description: 'Workspace API ID', type: string, format: uuid } }
                  type: object
                -
                  required: [link_id]
                  properties: { link_id: { description: 'Link API ID of the QR Code', type: string, format: uuid } }
                  type: object
      responses:
        '201':
          description: 'QR Code'
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
