      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                properties:
                  link_id: { description: 'Link API ID', type: string, format: uuid }
                  visits: { description: 'Total number of visits, combining clicks and scans', type: integer, example: 51 }
                  unique_visits: { description: 'Number of unique visitors, combining clicks and scans', type: integer, example: 32 }
