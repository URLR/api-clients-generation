      security:
        -
          ApiKeyAuth: []
    post:
      tags:
        - Domains
      summary: 'Create a domain'
      operationId: domainCreate
      requestBody:
        description: 'You can use this endpoint to add a custom domain to URLR.'
        content:
          application/json:
            schema:
              required:
                - domain
              properties:
                domain:
                  description: Domain
                  type: string
                  format: hostname
                  example: mybrand.com
                  maxLength: 255
                root_url:
                  description: 'Redirect URL for the root of the domain'
                  type: string
                  format: url
              type: object
      responses:
        '201':
          description: Domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                properties:
                  type: { type: string }
                  title: { type: string }
                  status: { type: integer, example: 401 }
                  detail: { type: string }
                type: object
        '429':
          description: 'Limits Exceeded'
          content:
