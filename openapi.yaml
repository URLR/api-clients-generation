        -
          ApiKeyAuth: []
  /workspaces:
    get:
      tags:
        - Workspaces
      summary: 'List workspaces of user'
      operationId: workspaceList
      responses:
        '200':
          description: 'Workspaces of user'
          content:
            application/json:
              schema:
                properties:
                  workspaces: { type: array, items: { $ref: '#/components/schemas/Workspace' } }
                type: object
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                properties:
                  type: { type: string }
                  title: { type: string }
                  status: { type: integer, example: 401 }
                  detail: { type: string }
                type: object
      security:
        -
          ApiKeyAuth: []
components:
  schemas:
    Domain:
      properties:
        id:
          description: 'Domain API ID'
          type: string
          format: uuid
        domain:
          description: Domain
          type: string
          format: hostname
          example: mybrand.com
        root_url:
          description: 'Redirect URL for the root of the domain'
          type: string
          format: url
        created_at:
          description: 'Creation date'
          type: string
          format: date-time
        updated_at:
          description: 'Modification date'
          type: string
          format: date-time
      type: object
    Folder:
      properties:
        id:
          description: 'Folder API ID'
          type: string
          format: uuid
        name:
          description: Name
          type: string
        workspace_id:
          description: 'Workspace API ID'
          type: string
          format: uuid
        parent_id:
          description: 'Parent Folder API ID'
          type: string
          format: uuid
        parent_name:
          description: 'Parent Folder name'
          type: string
        color:
          description: 'Color of folder'
          type: string
          enum:
            - blue
            - green
            - orange
            - purple
            - red
            - rose
            - yellow
            - black
        domain:
          description: Domain
          type: string
          format: hostname
        created_at:
          description: 'Creation date'
          type: string
          format: date-time
        updated_at:
          description: 'Modification date'
          type: string
          format: date-time
      type: object
    Link:
      properties:
        id:
          description: 'Link API ID'
          type: string
          format: uuid
        url:
          description: 'Original URL'
          type: string
        workspace_id:
          description: 'Workspace API ID'
          type: string
          format: uuid
        folder_id:
          description: 'Folder API ID'
          type: string
          format: uuid
        user:
          description: User
          type: string
        domain:
          description: Domain
          type: string
          format: hostname
          example: urlr.me
        code:
          description: 'Short code'
          type: string
          example: xxxxx
          maxLength: 50
          minLength: 2
        label:
          description: Label
          type: string
          maxLength: 255
        password:
          description: 'Password: "**********" means a password exists; null means no password.'
          type: string
          example: '**********'
          maxLength: 255
        created_at:
          description: 'Creation date'
          type: string
          format: date-time
        updated_at:
          description: 'Modification date'
          type: string
          format: date-time
        delete_at:
          description: 'Scheduled deletion date'
          type: string
          format: date-time
        expired_at:
          description: 'Scheduled expiration date'
          type: string
          format: date-time
        expired_url:
          description: 'The URL to which users will be redirected after the link has expired'
          type: string
          format: url
        expired_title:
          description: 'The title displayed on the expiration page'
          type: string
        expired_text:
          description: 'The text displayed on the expiration page'
          type: string
        delete_after_expiration:
          description: 'Whether the link should be deleted once it has expired'
          type: boolean
          default: false
        tags:
          description: Tags
          type: array
          items:
            properties:
              id:
                description: ID
                type: string
                format: uuid
              name:
                description: Name
                type: string
            type: object
          maxItems: 3
        qrcode:
          description: 'QR Code associated to the short link'
          properties:
            data:
              description: 'QR Code Data URL'
              type: string
          type: object
        utm:
          description: 'UTM parameters'
          properties:
            campaign:
              description: utm_campaign
              type: string
              maxLength: 255
            medium:
              description: utm_medium
              type: string
              maxLength: 255
            source:
              description: utm_source
              type: string
              maxLength: 255
            content:
              description: utm_content
              type: string
              maxLength: 255
          type: object
        metatag:
          description: 'Custom metadata for social previews'
          properties:
            title:
              description: 'Title of the link'
              type: string
              maxLength: 255
            description:
              description: 'Description of the link'
              type: string
              maxLength: 255
            image:
              description: 'Image URL of the link'
              type: string
              format: url
          type: object
        geolinks:
          description: 'Dynamic routing conditions'
          type: array
          items:
            properties:
              conditions:
                description: 'Conditions for dynamic routing'
                type: array
                items:
                  properties: { type: { description: 'Type of the condition ', type: string, enum: [country, language, system] }, value: { description: 'Value for the given type. Allowed values depend on "type": e.g., "US", "DE", "FR" for type "country"; "en", "fr", "de" for type "language"; "Android", "iOS" for type "system".', type: string }, operator: { description: 'Operator to apply for the condition', type: string, enum: [AND, OR] } }
                  type: object
              url:
                description: 'URL to redirect to when conditions match'
                type: string
                format: url
            type: object
      type: object
    LinkBaseRequest:
      properties:
        url:
          description: 'URL to shorten'
          type: string
          maxLength: 4096
        folder_id:
          description: 'Folder API ID'
          type: string
          format: uuid
        domain:
          description: Domain
          type: string
          format: hostname
          example: mybrand.com
        code:
          description: 'Custom short code'
          type: string
          pattern: '^[\p{L}0-9_\-/]{2,50}$'
          example: xxxxx
          maxLength: 50
          minLength: 2
        label:
          description: Label
          type: string
          maxLength: 255
        password:
          description: Password
          type: string
          maxLength: 255
        delete_at:
          description: 'Scheduled deletion date'
          type: string
          format: date-time
        expired_at:
          description: 'Scheduled expiration date'
          type: string
          format: date-time
        expired_url:
          description: 'The URL to which users will be redirected after the link has expired'
          type: string
          format: url
        expired_title:
          description: 'The title displayed on the expiration page'
          type: string
        expired_text:
          description: 'The text displayed on the expiration page'
          type: string
        delete_after_expiration:
          description: 'Whether the link should be deleted once it has expired'
          type: boolean
          default: false
        tags:
          description: Tags
          type: array
          items:
            type: string
            format: uuid
          maxItems: 3
        qrcode:
          description: 'QR Code'
          properties:
            size:
              description: 'The size of the QR code (px)'
              type: integer
              default: 600
              maximum: 1000
              minimum: 100
            format:
              description: 'The format of the QR code'
              type: string
              default: png
              enum:
                - png
                - webp
                - svg
            margin:
              description: 'The margin around the QR code (px)'
              type: integer
              default: 0
            background_color:
              description: 'The background color of the QR code (hexadecimal)'
              type: string
              default: '#ffffff'
            foreground_color:
              description: 'The foreground color of the QR code (hexadecimal)'
              type: string
              default: '#000000'
          type: object
        utm:
          description: 'UTM parameters'
          properties:
            campaign:
              description: utm_campaign
              type: string
              maxLength: 255
            medium:
              description: utm_medium
              type: string
              maxLength: 255
            source:
              description: utm_source
              type: string
              maxLength: 255
            content:
              description: utm_content
              type: string
              maxLength: 255
          type: object
        metatag:
          description: 'Custom metadata for social previews'
          properties:
            title:
              description: 'Title for the link'
              type: string
              maxLength: 255
            description:
              description: 'Description for the link'
              type: string
              maxLength: 255
            image:
              description: 'Image URL for the link. Recommended: 1200X630px<br>Maximum size: 3Mb - Formats: PNG, JPEG, WebP and GIF.'
              type: string
              format: url
          type: object
        geolinks:
          description: 'Dynamic routing conditions'
          type: array
          items:
            properties:
              conditions:
                description: 'Conditions for dynamic routing'
                type: array
                items:
                  properties: { type: { description: 'Type of the condition ', type: string, enum: [country, language, system] }, value: { description: 'Value for the given type. Allowed values depend on "type": e.g., "US", "DE", "FR" for type "country"; "en", "fr", "de" for type "language"; "Android", "iOS" for type "system".', type: string }, operator: { description: 'Operator to apply for the condition', type: string, enum: [AND, OR] } }
                  type: object
              url:
                description: 'URL to redirect to when conditions match'
                type: string
                format: url
            type: object
      type: object
    LinkCreateRequest:
      allOf:
        -
          required:
            - url
            - workspace_id
          properties:
            workspace_id:
              description: 'Workspace API ID'
              type: string
              format: uuid
          type: object
        -
          $ref: '#/components/schemas/LinkBaseRequest'
    LinkEditRequest:
      allOf:
        -
          $ref: '#/components/schemas/LinkBaseRequest'
    Workspace:
      properties:
        id:
          description: 'Workspace API ID'
          type: string
          format: uuid
        name:
          description: 'Workspace name'
          type: string
          example: 'the best team'
        created_at:
          description: 'Creation date'
          type: string
          format: date-time
        updated_at:
          description: 'Modification date'
          type: string
          format: date-time
      type: object
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-KEY
      in: header
