openapi: 3.0.0
info:
  title: 'URLR API Reference'
  description: "API powering the features of URLR.<br><br>Note that in order to facilitate integration, we provide SDKs for various languages at https://github.com/URLR.<br><br>Key API principles:<br>\n        <ul>\n        <li>All dates follow **ISO-8601** format</li>\n        <li>Most errors follow **RFC 9457** standard</li>\n        <li>All responses are delivered in English</li>\n    </ul>\n    All requests must include an API key generated in your workspace.\n    The key should be provided in the X-API-KEY HTTP header."
  termsOfService: 'https://urlr.me/en/terms-of-use'
  contact:
    name: URLR
    url: 'https://urlr.me/en'
  license:
    name: 'All rights reserved'
    url: 'https://urlr.me/en/legal-notice'
  version: 2.0.0
servers:
  -
    url: 'https://urlr.me/api/v2'
    description: 'Main API entry point'
paths:
  '/domains/{domain_id}':
    get:
      tags:
        - Domains
      summary: 'Get a domain'
      operationId: domainGet
      parameters:
        -
          name: domain_id
          in: path
          description: 'Domain API ID'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '404':
          description: 'Not Found'
          content:
            application/problem+json:
              schema:
                properties:
                  type: { type: string }
                  title: { type: string }
                  status: { type: integer, example: 404 }
                  detail: { type: string }
                type: object
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                properties:
                  type: { type: string }
                  title: { type: string }
                  status: { type: integer, example: 401 }
                  detail: { type: string }
                type: object
        '422':
          description: 'Validation Failed'
          content:
            application/problem+json:
              schema:
                properties:
                  type: { type: string }
                  title: { type: string }
                  status: { type: integer, example: 422 }
                  detail: { type: string }
                type: object
      security:
        -
          ApiKeyAuth: []
  /domains:
    get:
      tags:
        - Domains
      summary: 'List domains'
      operationId: domainList
      responses:
        '200':
          description: 'Domains of user'
          content:
            application/json:
              schema:
                properties:
                  domains: { type: array, items: { $ref: '#/components/schemas/Domain' } }
                type: object
        '404':
          description: 'Not Found'
          content:
            application/problem+json:
              schema:
                properties:
                  type: { type: string }
                  title: { type: string }
                  status: { type: integer, example: 404 }
                  detail: { type: string }
                type: object
        '401':
